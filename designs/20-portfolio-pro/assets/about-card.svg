<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Pro about card</title>
<desc id="dsc">Clean card with initials avatar.</desc>

<rect x="0" y="0" width="480" height="220" rx="0" fill="#FFFFFF"/><rect x="16" y="16" width="448" height="188" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/><circle cx="72" cy="84" r="30" fill="#0F172A"/><text x="72" y="93" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" id="card-initials">YN</text><text x="122" y="76" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="start" id="card-name">YOUR_NAME</text><text x="122" y="100" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#2563EB" text-anchor="start" id="card-role">YOUR_ROLE</text><text x="40" y="146" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start" id="card-value">YOUR_VALUE_SHORT</text><text x="40" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#475569" text-anchor="start" id="card-contact">@YOUR_USERNAME · YOUR_CONTACT</text>
</svg>
