<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Neon about card</title>
<desc id="dsc">Dark card with cycling neon border.</desc>

<defs><filter id="nglow15" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter></defs><rect x="0" y="0" width="480" height="220" rx="0" fill="#0A0A0A"/><rect x="10" y="10" width="460" height="200" rx="14" fill="none" stroke="#00F0FF" stroke-width="4" opacity="0.4" filter="url(#nglow15)"><animate  attributeName="stroke" values="#00F0FF;#39FF14;#FF2EC4;#00F0FF" dur="12s" begin="0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.33;0.66;1"/></rect><rect x="10" y="10" width="460" height="200" rx="14" fill="#101010" stroke="#00F0FF" stroke-width="2"><animate  attributeName="stroke" values="#00F0FF;#39FF14;#FF2EC4;#00F0FF" dur="12s" begin="0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.33;0.66;1"/></rect><text x="40" y="60" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#F5F5F5" text-anchor="start" id="card-name">YOUR_NAME</text><text x="40" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="normal" fill="#39FF14" text-anchor="start" id="card-role">YOUR_ROLE</text><circle cx="46" cy="128" r="5" fill="#39FF14"/><circle cx="46" cy="128" r="8" fill="none" stroke="#39FF14" stroke-width="1.5" opacity="0.6"><animate  attributeName="r" values="7;11;7" dur="2.4s" begin="0s" repeatCount="indefinite"/><animate  attributeName="opacity" values="0.6;0;0.6" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle><text x="60" y="133" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#F5F5F5" text-anchor="start" id="card-status">YOUR_STATUS</text><text x="40" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#FF2EC4" text-anchor="start" id="card-user">@YOUR_USERNAME</text>
</svg>
