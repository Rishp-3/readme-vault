<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Sunset about card</title>
<desc id="dsc">Translucent white card over gradient.</desc>

<defs><linearGradient id="cg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FF5E7E"/><stop offset="100%" stop-color="#9B4DCA"/></linearGradient></defs><rect x="0" y="0" width="480" height="220" rx="16" fill="url(#cg)"/><rect x="20" y="20" width="440" height="180" rx="12" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" opacity="0.18"/><circle cx="76" cy="88" r="32" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" opacity="0.25"/><text x="76" y="97" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle" id="card-initial">Y</text><text x="132" y="80" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start" id="card-name">YOUR_NAME</text><text x="132" y="104" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#FFFFFF" text-anchor="start" opacity="0.9" id="card-role">YOUR_ROLE</text><circle cx="48" cy="152" r="5" fill="#FFE29A"/><circle cx="48" cy="152" r="8" fill="none" stroke="#FFE29A" stroke-width="1.5" opacity="0.6"><animate  attributeName="r" values="7;11;7" dur="2.4s" begin="0s" repeatCount="indefinite"/><animate  attributeName="opacity" values="0.6;0;0.6" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle><text x="62" y="157" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#FFFFFF" text-anchor="start" id="card-status">YOUR_STATUS</text><text x="48" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#FFFFFF" text-anchor="start" opacity="0.9" id="card-user">@YOUR_USERNAME</text>
</svg>
