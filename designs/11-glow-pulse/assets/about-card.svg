<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Glow about card</title>
<desc id="dsc">Card with slowly pulsing border glow.</desc>

<defs><filter id="cg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter></defs><rect x="0" y="0" width="480" height="220" rx="0" fill="#0B0B1A"/><rect x="0" y="0" width="480" height="220" rx="14" fill="none" stroke="#A78BFA" stroke-width="6" opacity="0.25" filter="url(#cg)"/><rect x="1" y="1" width="478" height="218" rx="14" fill="#131328" stroke="#A78BFA" stroke-width="2"><animate  attributeName="stroke-opacity" values="0.35;1;0.35" dur="5s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/></rect><circle cx="70" cy="80" r="30" fill="#1d1b3a" stroke="#F472B6" stroke-width="2"/><text x="70" y="89" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E9D5FF" text-anchor="middle" id="card-initial">Y</text><text x="122" y="72" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E9D5FF" text-anchor="start" id="card-name">YOUR_NAME</text><text x="122" y="96" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#A78BFA" text-anchor="start" id="card-role">YOUR_ROLE</text><circle cx="40" cy="146" r="5" fill="#F472B6"/><circle cx="40" cy="146" r="8" fill="none" stroke="#F472B6" stroke-width="1.5" opacity="0.6"><animate  attributeName="r" values="7;11;7" dur="2.4s" begin="0s" repeatCount="indefinite"/><animate  attributeName="opacity" values="0.6;0;0.6" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle><text x="54" y="151" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#E9D5FF" text-anchor="start" id="card-status">YOUR_STATUS</text><text x="40" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#F472B6" text-anchor="start" id="card-user">@YOUR_USERNAME</text>
</svg>
