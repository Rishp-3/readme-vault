ues="0.2;1;0.2" dur="2.5s" begin="1.6s" repeatCount="indefinite"/></path><path d="M299 222 L302 227 L307 230 L302 233 L299 238 L296 233 L291 230 L296 227 Z" fill="#FFFFFF"><animate  attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="0.1s" repeatCount="indefinite"/></path><path d="M209 246 L212 251 L217 254 L212 257 L209 262 L206 257 L201 254 L206 251 Z" fill="#FFFFFF"><animate  attributeName="opacity" values="0.2;1;0.2" dur="4s" begin="1.8s" repeatCount="indefinite"/></path><path d="M94 102 L97 107 L102 110 L97 113 L94 118 L91 113 L86 110 L91 107 Z" fill="#FFFFFF"><animate  attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="0.3s" repeatCount="indefinite"/></path><path d="M893 239 L896 244 L901 247 L896 250 L893 255 L890 250 L885 247 L890 244 Z" fill="#FFFFFF"><animate  attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="2.5s" repeatCount="indefinite"/></path><text x="500" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#6B5B73" text-anchor="middle" id="banner-name" filter="url(#nsh)">YOUR_NAME</text><text x="500" y="192" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#6B5B73" text-anchor="middle" opacity="0.8" id="banner-tagline">YOUR_TAGLINE</text><text x="500" y="224" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#CDB4DB" text-anchor="middle" id="banner-role">YOUR_ROLE</text>
