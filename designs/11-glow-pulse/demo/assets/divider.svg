<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Divider</title>
<desc id="dsc">Traveling pulse dot.</desc>

<defs><filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter></defs><line x1="0" y1="12" x2="1000" y2="12" stroke="#A78BFA" stroke-width="1" opacity="0.4"/><circle cx="0" cy="12" r="6" fill="#F472B6" filter="url(#soft)"><animateTransform attributeName="transform" type="translate" values="0,12;1000,12" dur="3s" begin="0s" repeatCount="indefinite"/><animate  attributeName="opacity" values="0;1;1;0" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
</svg>
