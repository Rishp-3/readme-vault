<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Glass banner</title>
<desc id="dsc">Frosted panel over drifting blurred blobs (imitation).</desc>

<defs><filter id="bbg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter><linearGradient id="gbg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#312E81"/><stop offset="100%" stop-color="#0EA5E9"/></linearGradient></defs><rect x="0" y="0" width="1000" height="300" rx="0" fill="url(#gbg)"/><circle cx="220" cy="90" r="110" fill="#F0ABFC" opacity="0.8" filter="url(#bbg)"><animateTransform attributeName="transform" type="translate" values="0,0;60,40;0,0" dur="14s" begin="0s" repeatCount="indefinite"/></circle><circle cx="780" cy="210" r="120" fill="#38BDF8" opacity="0.8" filter="url(#bbg)"><animateTransform attributeName="transform" type="translate" values="0,0;-50,-30;0,0" dur="12s" begin="0s" repeatCount="indefinite"/></circle><circle cx="520" cy="60" r="70" fill="#F0ABFC" opacity="0.6" filter="url(#bbg)"><animateTransform attributeName="transform" type="translate" values="0,0;30,50;0,0" dur="10s" begin="0s" repeatCount="indefinite"/></circle><defs><linearGradient id="ghl" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient></defs><rect x="150" y="70" width="700" height="160" rx="20" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" opacity="0.18"/><rect x="151" y="71" width="698" height="56.0" rx="18" fill="url(#ghl)" opacity="0.5"/><text x="500" y="140" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle" id="banner-name">Rishabh pal</text><text x="500" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="middle" opacity="0.9" id="banner-tagline">Building clean and responsive UIs with React</text><text x="500" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#FFFFFF" text-anchor="middle" opacity="0.75" id="banner-role">Frontend Developer</text>
</svg>
