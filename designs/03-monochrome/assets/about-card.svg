<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-labelledby="ttl dsc">
<title id="ttl">About card</title>
<desc id="dsc">Black and white identity card.</desc>

<rect x="0" y="0" width="480" height="220" rx="0" fill="#111111"/><rect x="10" y="10" width="460" height="200" rx="0" fill="none" stroke="#3A3A3A" stroke-width="1"/><circle cx="70" cy="78" r="30" fill="none" stroke="#FFFFFF" stroke-width="1"/><text x="70" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="normal" fill="#FFFFFF" text-anchor="middle" id="card-initial">Y</text><text x="124" y="70" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="3" id="card-name">YOUR_NAME</text><text x="124" y="96" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#8A8A8A" text-anchor="start" letter-spacing="2" id="card-role">YOUR_ROLE</text><line x1="40" y1="130" x2="440" y2="130" stroke="#3A3A3A" stroke-width="1" stroke-dasharray="4 6"/><circle cx="48" cy="156" r="5" fill="#FFFFFF"/><text x="62" y="161" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#8A8A8A" text-anchor="start" id="card-status">YOUR_STATUS</text><text x="40" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#8A8A8A" text-anchor="start" id="card-user">@YOUR_USERNAME</text>
</svg>
