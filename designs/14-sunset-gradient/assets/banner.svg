<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Sunset banner</title>
<desc id="dsc">Half sun rising over layered silhouette hills.</desc>

<defs><linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FF9A3C"/><stop offset="35%" stop-color="#FF5E7E"/><stop offset="70%" stop-color="#9B4DCA"/><stop offset="100%" stop-color="#2A1233"/></linearGradient><radialGradient id="sunr" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFF3C4"/><stop offset="100%" stop-color="#FFD166"/></radialGradient><filter id="sunglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter></defs><rect x="0" y="0" width="1000" height="300" rx="0" fill="url(#sky)"/><g id="banner-sun"><circle cx="500" cy="210" r="70" fill="url(#sunr)"/><circle cx="500" cy="210" r="84" fill="#FFD166" opacity="0.35" filter="url(#sunglow)"/><animateTransform attributeName="transform" type="translate" values="0,14;0,-14;0,14" dur="12s" begin="0s" repeatCount="indefinite"/></g><text x="500" y="120" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle" id="banner-name">YOUR_NAME</text><text x="500" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="middle" opacity="0.92" id="banner-tagline">YOUR_TAGLINE</text><path d="M0 0 q 10 -10 20 0 q 10 -10 20 0" fill="none" stroke="#3A1C4A" stroke-width="2.5" stroke-linecap="round"><animateMotion path="M-60 90 L1060 78" dur="20s" begin="-0s" repeatCount="indefinite"/></path><path d="M0 0 q 13 -13 26 0 q 13 -13 26 0" fill="none" stroke="#3A1C4A" stroke-width="2.5" stroke-linecap="round"><animateMotion path="M-60 120 L1060 108" dur="24s" begin="-3s" repeatCount="indefinite"/></path><path d="M0 0 q 9 -9 18 0 q 9 -9 18 0" fill="none" stroke="#3A1C4A" stroke-width="2.5" stroke-linecap="round"><animateMotion path="M-60 78 L1060 66" dur="28s" begin="-7s" repeatCount="indefinite"/></path><path d="M0 300 L0 250 Q 150 200 320 248 T 640 240 T 1000 252 L1000 300 Z" fill="#9B4DCA" opacity="0.85"/><path d="M0 300 L0 272 Q 220 232 430 270 T 780 262 T 1000 276 L1000 300 Z" fill="#5A2A6E" opacity="0.9"/><path d="M0 300 L0 288 Q 300 262 560 288 T 1000 286 L1000 300 Z" fill="#2A1233"/>
