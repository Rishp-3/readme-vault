<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Wooden sign card</title>
<desc id="dsc">About card styled as a wooden trail sign.</desc>

<rect x="0" y="0" width="480" height="220" rx="14" fill="#6B4E2E"/><rect x="10" y="10" width="460" height="200" rx="10" fill="#7C5A3A"/><path d="M20 40 q 220 4 440 0" fill="none" stroke="#5E4327" stroke-width="1" opacity="0.35"/><path d="M20 66 q 220 -4 440 0" fill="none" stroke="#5E4327" stroke-width="1" opacity="0.35"/><path d="M20 92 q 220 4 440 0" fill="none" stroke="#5E4327" stroke-width="1" opacity="0.35"/><path d="M20 118 q 220 4 440 0" fill="none" stroke="#5E4327" stroke-width="1" opacity="0.35"/><path d="M20 144 q 220 -4 440 0" fill="none" stroke="#5E4327" stroke-width="1" opacity="0.35"/><path d="M20 170 q 220 4 440 0" fill="none" stroke="#5E4327" stroke-width="1" opacity="0.35"/><path d="M20 196 q 220 4 440 0" fill="none" stroke="#5E4327" stroke-width="1" opacity="0.35"/><rect x="24" y="24" width="432" height="172" rx="8" fill="#0F3D22" stroke="#D8B98C" stroke-width="2"/><text x="48" y="68" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#DCFCE7" text-anchor="start" id="card-name">YOUR_NAME</text><text x="48" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#86EFAC" text-anchor="start" id="card-role">YOUR_ROLE</text><circle cx="52" cy="128" r="5" fill="#22C55E"/><circle cx="52" cy="128" r="8" fill="none" stroke="#22C55E" stroke-width="1.5" opacity="0.6"><animate  attributeName="r" values="7;11;7" dur="2.4s" begin="0s" repeatCount="indefinite"/><animate  attributeName="opacity" values="0.6;0;0.6" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle><text x="66" y="133" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#DCFCE7" text-anchor="start" id="card-status">YOUR_STATUS</text><text x="48" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#86EFAC" text-anchor="start" id="card-user">@YOUR_