<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Glow pulse banner</title>
<desc id="dsc">Pulsing orb behind the name.</desc>

<defs><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter><filter id="tglow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#A78BFA" flood-opacity="0.9"/></filter><radialGradient id="orb" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#F472B6" stop-opacity="0.9"/><stop offset="60%" stop-color="#A78BFA" stop-opacity="0.5"/><stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1000" height="300" rx="0" fill="#0B0B1A"/><circle cx="500" cy="150" r="26" fill="url(#orb)" filter="url(#soft)"/><circle cx="500" cy="150" r="34" fill="none" stroke="#F472B6" stroke-width="2" opacity="0.7"><animate  attributeName="r" values="34;44;34" dur="3s" begin="0.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/><animate  attributeName="opacity" values="0.7;0.25;0.7" dur="3s" begin="0.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/></circle><circle cx="500" cy="150" r="52" fill="none" stroke="#A78BFA" stroke-width="2" opacity="0.7"><animate  attributeName="r" values="52;62;52" dur="3s" begin="0.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/><animate  attributeName="opacity" values="0.7;0.25;0.7" dur="3s" begin="0.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/></circle><circle cx="500" cy="150" r="72" fill="none" stroke="#A78BFA" stroke-width="2" opacity="0.7"><animate  attributeName="r" values="72;82;72" dur="3s" begin="1.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/><animate  attributeName="opacity" values="0.7;0.25;0.7" dur="3s" begin="1.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/></circle><text filter="url(#tglow)" x="500" y="250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#E9D5FF" text-anchor="middle" id="banner-name">Rishabh pal<animate  attributeName="opacity" values="0.85;1;0.85" dur="4s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/></text><text x="500" y="285" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#A78BFA" text-anchor="middle" id="banner-tagline">Building clean and responsive UIs with React</text>
