<defs><filter id="nglow15" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter></defs><rect x="0" y="0" width="1000" height="300" rx="0" fill="#0A0A0A"/><rect x="309" y="84" width="383" height="110" rx="18" fill="none" stroke="#00F0FF" stroke-width="3" opacity="0.55" filter="url(#nglow15)"/><rect x="309" y="84" width="383" height="110" rx="18" fill="none" stroke="#00F0FF" stroke-width="2"/><text x="500" y="152" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#F5F5F5">Risha<tspan id="flicker-letter">b<animate attributeName="opacity" values="1;1;0.15;1;0.3;1;1;0.1;1" keyTimes="0;0.6;0.63;0.66;0.7;0.73;0.9;0.93;1" dur="7s" repeatCount="indefinite" calcMode="discrete"/></tspan>h pal</text><text x="500" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="normal" fill="#39FF14" text-anchor="middle" letter-spacing="6" id="banner-role">FRONTEND DEVELOPER</text><text x="500" y="254" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#FF2EC4" text-anchor="middle" id="banner-tagline">Building clean and responsive UIs with React</text>
