<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Terminal banner</title>
<desc id="dsc">Green terminal that types whoami and role.</desc>

<defs><pattern id="crt" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#33FF66"/></pattern></defs><style><![CDATA[
@media (prefers-reduced-motion: reduce){*{animation:none !important;}}

]]></style><rect x="0" y="0" width="1000" height="300" rx="0" fill="#050A05"/><rect x="30" y="24" width="940" height="40" rx="8" fill="#0F2A14"/><circle cx="54" cy="44" r="7" fill="#FF5F56"/><circle cx="78" cy="44" r="7" fill="#FFBD2E"/><circle cx="102" cy="44" r="7" fill="#27C93F"/><text x="500" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="normal" fill="#1A8F3C" text-anchor="middle" id="term-title">rishp-3@host: ~</text><defs><clipPath id="clipL0"><rect x="52" y="78" width="0" height="30"><animate  attributeName="width" values="0;102" dur="0.9s" begin="0.6s" repeatCount="0" calcMode="linear" fill="freeze"/></rect></clipPath></defs><g clip-path="url(#clipL0)"><text x="56" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#33FF66" text-anchor="start" id="term-line-0">$ whoami</text></g><defs><clipPath id="clipL1"><rect x="52" y="118" width="0" height="30"><animate  attributeName="width" values="0;138" dur="0.9s" begin="1.7000000000000002s" repeatCount="0" calcMode="linear" fill="freeze"/></rect></clipPath></defs><g clip-path="url(#clipL1)"><text x="56" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#E8FFE8" text-anchor="start" id="term-line-1">Rishabh pal</text></g><defs><clipPath id="clipL2"><rect x="52" y="158" width="0" height="30"><animate  attributeName="width" values="0;174" dur="0.9s" begin="2.8000000000000003s" repeatCount="0" calcMode="linear" fill="freeze"/></rect></clipPath></defs><g clip-path="url(#clipL2)"><text x="56" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#33FF66" text-anchor="start" id="term-line-2">$ cat role.txt</text></g><defs><clipPath id="clipL3"><rect x="52" y="198" width="0" height="30"><animate  attributeName="width" values="0;222" dur="0.9s" begin="3.9000000000000004s" repeatCount="0" calcMode="linear" fill="freeze"/></rect></clipPath></defs><g clip-path="url(#clipL3)"><text x="56" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="normal" fill="#E8FFE8" text-anchor="start" id="term-line-3">Frontend Developer</text></g><rect x="282.0" y="202" width="11" height="22" rx="0" fill="#33FF66"><animate  attributeName="opacity" values="1;1;0;0" dur="1s" begin="0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5;0.5;1"/></rect>
</svg>
