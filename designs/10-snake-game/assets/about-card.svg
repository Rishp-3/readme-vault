<svg xmlns="http://www.w3.org/2000/svg" width="480" height="220" viewBox="0 0 480 220" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Snake about card</title>
<desc id="dsc">GitHub-dark identity card.</desc>

<rect x="0" y="0" width="480" height="220" rx="10" fill="#161B22" stroke="#161B22" stroke-width="1"/><circle cx="70" cy="80" r="30" fill="#161B22" stroke="#58A6FF" stroke-width="2"/><text x="70" y="89" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#C9D1D9" text-anchor="middle" id="card-initial">Y</text><text x="122" y="72" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#C9D1D9" text-anchor="start" id="card-name">YOUR_NAME</text><text x="122" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="normal" fill="#39D353" text-anchor="start" id="card-role">YOUR_ROLE</text><circle cx="40" cy="142" r="5" fill="#39D353"/><circle cx="40" cy="142" r="8" fill="none" stroke="#39D353" stroke-width="1.5" opacity="0.6"><animate  attributeName="r" values="7;11;7" dur="2.4s" begin="0s" repeatCount="indefinite"/><animate  attributeName="opacity" values="0.6;0;0.6" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle><text x="54" y="147" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#C9D1D9" text-anchor="start" id="card-status">YOUR_STATUS</text><text x="40" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" fill="#58A6FF" text-anchor="start" id="card-note">@YOUR_USERNAME · press ▶ to watch the snake</text>
</svg>
