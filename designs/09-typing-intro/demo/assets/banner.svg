<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Typing banner</title>
<desc id="dsc">Typed phrases cycling every 16 seconds.</desc>

<defs><clipPath id="typeClip0"><rect x="60" y="110" width="0" height="60"><animate  attributeName="width" values="0;242;242;0" dur="4.00s" begin="0.00s" repeatCount="indefinite" calcMode="linear"/></rect></clipPath><clipPath id="typeClip1"><rect x="60" y="110" width="0" height="60"><animate  attributeName="width" values="0;288;288;0" dur="4.00s" begin="4.00s" repeatCount="indefinite" calcMode="linear"/></rect></clipPath><clipPath id="typeClip2"><rect x="60" y="110" width="0" height="60"><animate  attributeName="width" values="0;460;460;0" dur="4.00s" begin="8.00s" repeatCount="indefinite" calcMode="linear"/></rect></clipPath><clipPath id="typeClip3"><rect x="60" y="110" width="0" height="60"><animate  attributeName="width" values="0;351;351;0" dur="4.00s" begin="12.00s" repeatCount="indefinite" calcMode="linear"/></rect></clipPath></defs><rect x="0" y="0" width="1000" height="300" rx="0" fill="#0D1117"/><g clip-path="url(#typeClip0)"><text x="60" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="600" fill="#C9D1D9" text-anchor="start" id="phrase-0">Hi, I'm Rishabh</text></g><g clip-path="url(#typeClip1)"><text x="60" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="600" fill="#58A6FF" text-anchor="start" id="phrase-1">Frontend Developer</text></g><g clip-path="url(#typeClip2)"><text x="60" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="600" fill="#C9D1D9" text-anchor="start" id="phrase-2">React · Tailwind · JavaScript</text></g><g clip-path="url(#typeClip3)"><text x="60" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="600" fill="#58A6FF" text-anchor="start" id="phrase-3">Open to collaborations</text></g><rect x="300" y="132" width="12" height="34" rx="0" fill="#58A6FF"><animate  attributeName="x" values="300;346;518;409;300" dur="16.0s" begin="0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.000;0.250;0.500;0.750;1.000"/><animate  attributeName="opacity" values="1;1;0;0" dur="0.9s" begin="0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5;0.5;1"/></rect><text x="60" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="normal" fill="#8B949E" text-anchor="start" id="banner-sub">&gt; self-taught since 2023 · goal: full stack</text>
</svg>
